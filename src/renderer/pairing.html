<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Growth'Lib Desktop — Connexion</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; background: #1d1f1a; color: #eee; margin: 0; padding: 32px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p.sub { font-size: 12px; color: #999; margin: 0 0 20px; }
  label { display: block; font-size: 12px; color: #bbb; margin: 14px 0 4px; }
  input, select { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 6px; border: 1px solid #444; background: #2a2c26; color: #eee; font-size: 13px; }
  button { margin-top: 20px; width: 100%; padding: 10px; border-radius: 6px; border: none; background: #7c9128; color: #fff; font-weight: 600; cursor: pointer; font-size: 13px; }
  button:disabled { opacity: .5; cursor: default; }
  #erreur { color: #e88a8c; font-size: 12px; margin-top: 10px; min-height: 16px; }
  #etape-compte { display: none; }
</style>
</head>
<body>
  <h1>Growth'Lib Desktop</h1>
  <p class="sub">Connecte ce poste à ton compte Growth'Lib — l'exécution de ton compte LinkedIn basculera ici.</p>

  <div id="etape-login">
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username">
    <label for="password">Mot de passe</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="btn-login" onclick="seConnecter()">Se connecter</button>
  </div>

  <div id="etape-compte">
    <label for="compte">Compte LinkedIn à piloter depuis ce poste</label>
    <select id="compte"></select>
    <button id="btn-choisir" onclick="choisirCompte()">Démarrer l'exécution locale</button>
  </div>

  <div id="erreur"></div>

  <script src="pairing-renderer.js"></script>
</body>
</html>
