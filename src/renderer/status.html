<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Growth'Lib Desktop — Tableau de bord</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, sans-serif; background: #15160f; color: #eee; margin: 0; padding: 20px 24px; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  p.sub { font-size: 11px; color: #999; margin: 0 0 18px; }
  h2 { font-size: 11.5px; color: #aaa; text-transform: uppercase; letter-spacing: .04em; margin: 22px 0 8px; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .kpi { background: #1e2017; border: 1px solid #2c2e22; border-radius: 10px; padding: 12px 14px; }
  .kpi .n { font-size: 24px; font-weight: 700; line-height: 1.1; }
  .kpi .l { font-size: 10.5px; color: #999; margin-top: 3px; }
  .kpi.alerte .n { color: #e07c7c; }
  .kpi.alerte.zero .n { color: #5fd47a; }
  .kpi.ok .n { color: #c8d16a; }

  .tendance { display: flex; align-items: flex-end; gap: 4px; height: 70px; margin-top: 6px; }
  .tendance .barre { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .tendance .barre .b { width: 100%; background: #6b8f3a; border-radius: 2px 2px 0 0; min-height: 2px; }
  .tendance .barre .j { font-size: 8.5px; color: #777; margin-top: 3px; white-space: nowrap; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: #888; font-weight: 500; padding: 4px 8px; border-bottom: 1px solid #2c2e22; }
  td { padding: 5px 8px; border-bottom: 1px solid #22241b; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .vide { color: #666; font-style: italic; padding: 8px; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 10px; font-weight: 600; }
  .badge-pending { background: #4a4420; color: #e0c84a; }
  .badge-running { background: #203a4a; color: #5ab0e0; }
  .badge-done { background: #1f3a24; color: #5fd47a; }
  .badge-failed { background: #3a1f1f; color: #e07c7c; }
  .quand { color: #777; font-size: 10.5px; white-space: nowrap; }
  #refresh { position: fixed; top: 16px; right: 20px; font-size: 11px; color: #777; }
  details summary { cursor: pointer; font-size: 11px; color: #999; margin-top: 4px; }
</style>
</head>
<body>
  <span id="refresh">⟳ --</span>
  <h1>Growth'Lib Desktop</h1>
  <p class="sub" id="compte-label">Compte —</p>

  <div class="kpis">
    <div class="kpi ok"><div class="n" id="k-workflows">—</div><div class="l">Workflows actifs</div></div>
    <div class="kpi"><div class="n" id="k-pending">—</div><div class="l">Jobs en attente</div></div>
    <div class="kpi ok"><div class="n" id="k-done">—</div><div class="l" id="l-done">Réalisés (10j)</div></div>
    <div class="kpi alerte zero"><div class="n" id="k-alertes">—</div><div class="l" id="l-alertes">Alertes (10j)</div></div>
  </div>

  <h2>Activité des 10 derniers jours</h2>
  <div class="tendance" id="tendance"></div>

  <h2>En attente (<span id="n-pending">0</span>)</h2>
  <table id="t-pending"><thead><tr><th>Type</th><th>Prévu</th><th>Détail</th></tr></thead><tbody></tbody></table>

  <details style="margin-top:18px">
    <summary>Historique détaillé (20 derniers)</summary>
    <table id="t-done" style="margin-top:8px"><thead><tr><th>Type</th><th>Statut</th><th>Quand</th><th>Détail</th></tr></thead><tbody></tbody></table>
  </details>

  <script src="status-renderer.js"></script>
</body>
</html>
